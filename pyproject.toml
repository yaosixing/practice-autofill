[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "practice-autofill"
version = "0.1.0"
description = "Human-confirmed answer filling for authorized practice forms"
requires-python = ">=3.11"
dependencies = ["playwright>=1.49,<2", "openai>=1.66,<3"]

[project.scripts]
practice-autofill = "practice_autofill.cli:main"

[tool.setuptools.packages.find]
include = ["practice_autofill*"]

[tool.setuptools.package-data]
practice_autofill = ["adapters/*.js", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
